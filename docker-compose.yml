version: '3'

services:
  szeyap-api:
    container_name: szeyap-api
    build:
      context: ./szeyap-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "szeyapapi.api:app", "--bind=0.0.0.0:8000"]
  szeyap-discord-client:
    container_name: szeyap-discord-client
    build:
      context: ./szeyap-discord-client
      dockerfile: Dockerfile
    command: ["npm", "start"]
    restart: unless-stopped
    environment:
      - NODE_ENV=PRODUCTION
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APPLICATION_ID=${APPLICATION_ID}
      - DEV_GUILD_ID=${DEV_GUILD_ID}
      - API_BASE_URL=${API_BASE_URL:-https://szeyap-backend-production.up.railway.app}
  szeyap-web-client:
    container_name: szeyap-web-client
    build:
      context: ./szeyap-web-client
      dockerfile: Dockerfile.prod
    command: ["npm", "start"]
    ports:
      - '80:80'
      - '443:443'
    profiles:
      - with-web-client
